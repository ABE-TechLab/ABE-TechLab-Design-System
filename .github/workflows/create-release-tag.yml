name: Create release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag matching package.json, for example v0.1.0"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: create-release-tag-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format, such as v0.1.0."
            exit 1
          fi

          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${RELEASE_TAG#v}" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION on main."
            exit 1
          fi

          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git show "$RELEASE_TAG:package.json" > /tmp/release-package.json
            TAGGED_VERSION="$(node -p "require('/tmp/release-package.json').version")"
            if [[ "$TAGGED_VERSION" != "${RELEASE_TAG#v}" ]]; then
              echo "Existing tag $RELEASE_TAG points to package version $TAGGED_VERSION; refusing to publish it."
              exit 1
            fi
            echo "Tag $RELEASE_TAG already exists and its package version is correct. Tag creation will be skipped."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi

      - name: Dispatch package publishing workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main --field tag="$RELEASE_TAG"
