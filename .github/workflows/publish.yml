name: Publish design system

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        default: "v0.1.0"
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js and GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@abe-techlab'

      - name: Ensure release tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use vMAJOR.MINOR.PATCH format, such as v0.1.0."
            exit 1
          fi

          TAG_VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [[ "$TAG_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Tag $RELEASE_TAG does not match package version $PACKAGE_VERSION."
            exit 1
          fi

      - name: Install package dependencies
        run: npm install --no-audit --no-fund

      - name: Validate, build, and inspect package
        run: |
          npm run check
          npm run build
          npm pack --dry-run

      - name: Publish to GitHub Packages if this version is not already present
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version --json >/dev/null 2>npm-view-error.log; then
            echo "::notice::${PACKAGE_NAME}@${PACKAGE_VERSION} already exists; skipping duplicate publish."
            exit 0
          fi

          if grep -Eqi 'E404|404 Not Found|No match found' npm-view-error.log; then
            npm publish
          else
            cat npm-view-error.log
            echo "Unable to verify whether the package version already exists."
            exit 1
          fi
